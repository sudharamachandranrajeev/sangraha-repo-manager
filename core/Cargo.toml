[package]
name = "sangraha-core"
description = "Sangraha's core: the repository board and the apps installed from GitHub releases"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# File contents in GitHub's contents API.
base64 = "0.23"
# Bundled SQLite, so Windows needs no system copy.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secret patterns in the leak check.
regex = "1"
# SHA-256 of downloaded apps, checked against the publisher's.
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tempfile = "3"

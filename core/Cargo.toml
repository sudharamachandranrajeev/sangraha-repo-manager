[package]
name = "sangraha-core"
description = "Repository board for Sangraha: GitHub state, local clones and what needs attention"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Bundled SQLite, so Windows needs no system copy.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tempfile = "3"
